  </g>

  <!-- Bottom: Official Wordmark Group Centered -->
  <g transform="translate(300, 480)">
    <!-- Primary Title: SINGULARITY -->
    <text x="0" y="30" fill="#0f172a" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="0.16em">SINGULARITY</text>
    
    <!-- Sub-Brand: NEBULAX STUDIO -->
    <text x="0" y="85" fill="#0f172a" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="0.38em">NEBULAX STUDIO</text>
    
    <!-- Accent Divider Line -->
    <line x1="-160" y1="112" x2="160" y2="112" stroke="#0f172a" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="10 6" />

    <!-- Tagline: QUANTUM MINECRAFT RUNTIME -->
    <text x="0" y="146" fill="#475569" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.22em">QUANTUM MINECRAFT RUNTIME</text>

    <!-- Version Badge Centered -->
    <g transform="translate(-40, 172)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5" />
      <text x="40" y="19" fill="#0f172a" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.05em">v2.0 PRO</text>
