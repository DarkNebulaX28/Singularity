<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Singularity — Vertical Stacked Lockup (Black)">
  <title>Singularity — Vertical Stacked Lockup (Black)</title>
  <defs>
    
  </defs>

  <!-- Top: Symbol (Scale 380x380, centered at X=110, Y=30) -->
  <g transform="translate(110, 30) scale(0.7421875)">
    
  <!-- Outer Hull -->
  <g fill="#0f172a" stroke="#0f172a" stroke-linejoin="round">
    <path d="M 244,42 L 68,144 C 64,146 61,151 61,156 L 61,212 L 108,185 L 108,164 L 244,85 Z" fill-opacity="0.12" stroke-width="2.5" />
    <path d="M 268,42 L 268,85 L 404,164 L 404,185 L 451,212 L 451,156 C 451,151 448,146 444,144 Z" fill-opacity="0.12" stroke-width="2.5" />
    <path d="M 462,234 L 416,207 L 416,305 L 462,278 C 466,276 469,271 469,266 L 469,246 C 469,241 466,236 462,234 Z" fill-opacity="0.12" stroke-width="2.5" />
    <path d="M 451,300 L 404,327 L 404,348 L 268,427 L 268,470 L 444,368 C 448,366 451,361 451,356 Z" fill-opacity="0.12" stroke-width="2.5" />
    <path d="M 244,470 L 244,427 L 108,348 L 108,327 L 61,300 L 61,356 C 61,361 64,366 68,368 Z" fill-opacity="0.12" stroke-width="2.5" />
    <path d="M 50,234 C 46,236 43,241 43,246 L 43,266 C 43,271 46,276 50,278 L 96,305 L 96,207 Z" fill-opacity="0.12" stroke-width="2.5" />
  </g>

  <!-- Orbital Rings -->
  <g fill="none" stroke="#0f172a" stroke-width="2">
    <ellipse cx="256" cy="256" rx="180" ry="76" stroke-opacity="0.4" stroke-dasharray="24 12" transform="rotate(-30 256 256)" />
    <ellipse cx="256" cy="256" rx="172" ry="68" stroke-opacity="0.3" stroke-dasharray="30 14" transform="rotate(40 256 256)" />
  </g>

  <!-- Central Voxel Core -->
  <g stroke="#0f172a" stroke-linejoin="round">
    <!-- Top Face -->
    <polygon points="256,160 339.14,208 256,256 172.86,208" fill="#0f172a" fill-opacity="0.9" stroke-width="2.5" />
    <!-- Left Face -->
    <polygon points="172.86,208 256,256 256,352 172.86,304" fill="#0f172a" fill-opacity="0.5" stroke-width="2.5" />
    <!-- Right Face -->
    <polygon points="256,256 339.14,208 339.14,304 256,352" fill="#0f172a" fill-opacity="0.3" stroke-width="2.5" />

    <!-- Center Aperture -->
    <polygon points="256,230 278.52,243 278.52,269 256,282 233.48,269 233.48,243" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <circle cx="256" cy="256" r="8" fill="#0f172a" />
    
    <!-- Star Flare -->
    <polygon points="256,238 258.5,256 256,274 253.5,256" fill="#0f172a" />
    <polygon points="238,256 256,258.5 274,256 256,253.5" fill="#0f172a" />
  </g>

  <!-- 6 Orbiting Mineral Voxels -->
  <g fill="#0f172a" stroke="#0f172a">
